services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${ENDURANCE_ACTIVITY_POSTGRESQL_TEST_DATABASE_NAME}
      POSTGRES_USER: ${ENDURANCE_ACTIVITY_POSTGRESQL_TEST_DATABASE_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:${ENDURANCE_ACTIVITY_POSTGRESQL_TEST_DATABASE_PORT}:5432"
    volumes:
      - "${ENDURANCE_ACTIVITY_POSTGRESQL_TEST_DATABASE_PASSWORD_FILE}:/run/secrets/postgres_password:ro,z"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENDURANCE_ACTIVITY_POSTGRESQL_TEST_DATABASE_USER} -d ${ENDURANCE_ACTIVITY_POSTGRESQL_TEST_DATABASE_NAME}"]
      interval: 2s
      timeout: 2s
      retries: 30
